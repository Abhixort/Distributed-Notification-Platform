[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-notification-platform"
version = "1.0.0"
description = "A resilient, high-throughput distributed notification engine supporting multi-channel delivery (Email, SMS, Webhook), idempotency, and token-bucket rate limiting."
authors = [{ name = "Abhishek", email = "abhishek@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.2",
    "aiosqlite>=0.20.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.8",
    "flower>=2.0.1",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "boto3>=1.35.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prometheus-client>=0.20.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "locust>=2.31.0",
    "black>=24.8.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
